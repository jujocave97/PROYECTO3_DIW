<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesion</title>
    <link rel="stylesheet" type="text/css" href="./style/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goblin+One&family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logoContainer">
            <img src="./img/logo.png" alt="Logo de Superhero Collection" />
            <h1>SUPERHERO COLLECTION</h1> 
        </div>
       <nav class="navegador">
            <a href="contacto.html" class="hoverEnlace">MAS</a>
            <a href="#" class="hoverEnlace">LOGIN</a>
       </nav>
    </header>
    <div class="divFormulario">
        <form action="/procesar_formulario" method="post" class="inicioSesionFormulario">
            <label for="nombre" class="labelInicioSesion">Correo electrónico o Nombre de usuario</label>
            <input type="text" id="nombre" name="nombre" required>
            <br><br>
            
            <label for="password" class="labelInicioSesion">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            
            <button type="submit">Enviar</button>
        </form>
    </div>
    <footer>
        <div>
            <img src="./img/instagram.png" alt="instagram" />
            <img src="./img/github.png" alt="github" />
            <img src="./img/figma.png" alt="figma" />
        </div>
        <p>@ 2023 All Rights Reserved</p>
    </footer>
</body>
</html>
