<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro</title>
        <link rel="stylesheet" type="text/css" href="./style/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Goblin+One&family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">
    </head>
<body>
    <header>
        <div class="logoContainer">
            <img src="./img/logo.png" alt="Logo de Superhero Collection" />
            <h1>SUPERHERO COLLECTION</h1> 
        </div>
       <nav class="navegador">
            <a href="contacto.html" class="hoverEnlace">MAS</a>
            <a href="inicioSesion.html" class="hoverEnlace">LOGIN</a>
       </nav>
    </header>
    <div class="divRegistro">
        <form action="/procesar_registro" method="POST" class="registroFormulario">
    
            <label for="correo" class="labelRegistro">Correo Electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
        
            <label for="nombre_usuario" class="labelRegistro">Nombre de Usuario:</label>
            <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Ingresa tu nombre de usuario" required>
        
            <label for="fecha_nacimiento" class="labelRegistro">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        
            <label for="contrasena" class="labelRegistro">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>
        
            <label for="repite_contrasena" class="labelRegistro">Repite la Contraseña:</label>
            <input type="password" id="repite_contrasena" name="repite_contrasena" placeholder="Repite tu contraseña" required>
        
            <div class="terminos">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">Aceptar términos y condiciones de servicio</label>
            </div>

            <button type="submit">Registrarse</button>
          </form>
    </div>
    <footer>
        <div>
            <img src="./img/instagram.png" alt="instagram" />
            <img src="./img/github.png" alt="github" />
            <img src="./img/figma.png" alt="figma" />
        </div>
        <p>@ 2023 All Rights Reserved</p>
    </footer>
</body>
</html>
