<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto</title>
        <link rel="stylesheet" type="text/css" href="./style/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Goblin+One&family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">
    </head>
<body>
    <header>
        <div class="logoContainer">
            <img src="./img/logo.png" alt="Logo de Superhero Collection" />
            <h1>SUPERHERO COLLECTION</h1> 
        </div>
       <nav class="navegador">
            <a href="#" class="hoverEnlace">MAS</a>
            <a href="inicioSesion.html" class="hoverEnlace">LOGIN</a>
       </nav>
    </header>
    <!-- Elementos del contacto -->
    <div class="segundoMenu">
        <h2><a href="#" class="hoverEnlace">Contáctanos</a></h2>
        <h2><a href="api.html" class="hoverEnlace">API</a></h2>
    </div>
    <div class="contenidoContacto">
        <img src="./img/logo.png" alt="logo" />
        <form action="#" method="post" class="formularioContacto">
            <h2>Datos de Contacto</h2>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="" required>

            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="">

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="" required></textarea>

            <button type="submit"><img src="./img/enviarContacto.png" alt="enviar"></button>
        </form>

    </div>
    <footer>
        <div>
            <img src="./img/instagram.png" alt="instagram" />
            <img src="./img/github.png" alt="github" />
            <img src="./img/figma.png" alt="figma" />
        </div>
    
        <p>@ 2023 All Rights Reserved</p>
    </footer>
</body>
</html>
